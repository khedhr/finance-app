name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app files
        run: |
          npm install
          cp index.html www/index.html
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#c4522c' --splashBackgroundColor '#0f6b5c'
          npx cap sync android

      - name: Use the app's fixed signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp android-signing.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PocketLedger.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PocketLedger.apk \
            --title "Pocket Ledger for Android" \
            --notes "Download PocketLedger.apk on your Android phone and open it to install. Built from commit ${GITHUB_SHA::7}."
